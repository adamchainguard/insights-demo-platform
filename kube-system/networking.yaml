apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node
    spec:
      containers:
        - name: node
          image: quay.io/calico/node:latest
