apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: vault
spec:
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul-2
  namespace: vault
spec:
  selector:
    matchLabels:
      app: consul-2
  template:
    metadata:
      labels:
        app: consul-2
    spec:
      containers:
        - name: consul-2
          image: bitnami/consul:latest
---
apiVersion: apps/v1
