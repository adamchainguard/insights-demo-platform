apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-maintenance
  namespace: platform
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: wait
              image: busybox:latest
              command: ["sh", "-c", "sleep 5"]
          containers:
            - name: curl
              image: curlimages/curl:latest
              args: ["-fsS", "http://maintenance.platform.svc/run"]
            - name: kubectl
              image: bitnami/kubectl:latest
              args: ["get", "pods", "-A"]
            - name: git-sync
              image: registry.k8s.io/git-sync/git-sync:latest
