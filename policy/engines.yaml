apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: policy
spec:
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:latest
