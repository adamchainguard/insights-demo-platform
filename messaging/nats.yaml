apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: cgr.dev/0-cve.com/nats:latest
